# Form terms (design §24.9, D32): what Crewdeck knows about the questions application forms ask, per language. Data, not
# code: add a language or a word here and the fill plan, the drafting step and `crewdeck jobs check` read it. Every
# language is used at once (a form may mix languages); `en-IN` and `en-PH` hold Indian and Philippine English usages.
# Labels are compared lowercase, without accents, required marks, "(optional)" or a leading "your".
#
# How an entry is written (as in rule-words.yaml): a space or hyphen matches a space or a hyphen; "word*" a word start;
# slots joined by " + " follow each other, "a|b" are alternatives in a slot, a slot ending in "?" may be missing.
#
# Per language:
#   profile:     profile key → whole labels it answers ("first name" fills only a label that is exactly that). Keys are
#                me/profile.md's: identity fields, the latest education, and standard answers by their key.
#   sensitive:   words that make a question sensitive anywhere in its label: only the user's explicit answer fills it,
#                and a remembered answer is reused for the same company only (unless they say "use this everywhere").
#   sensitive_exact: whole labels that are sensitive only on their own ("Title" as a salutation).
#   never_fill:  government ID, bank and tax numbers anywhere in the label: always skipped ("you type this yourself"),
#                never drafted, never stored, refused as a standard answer or a remembered answer.
#   never_fill_exact: whole labels that are such numbers only on their own ("PAN", "NIE", "TIN": short words that are
#                ordinary words elsewhere).
#   groups:      "Add another" blocks (employment, education, references): each field's part of an entry.
#   add:         words on an "Add another …" button.
#   letter:      upload labels a cover letter or supporting statement goes into.

languages:
  en:
    profile:
      country: [country, country of residence, "country you live|reside in"]
      region: [state, province, region, "state|province|region + of residence", state/province]
      city: [city, current city, location (city), location city, town]
      school: [school, school name, university, college, institution]
      degree: [degree, degree type, qualification]
      discipline: [discipline, field of study, major, subject]
      end_year: [graduation year, end year, end date year]
      preferred_name: [preferred name, preferred first name]
      first_name: [first name, legal first name, given name, forename]
      last_name: [last name, legal last name, surname, family name]
      full_name: [name, full name, legal name]
      email: [email, e-mail, email address, e-mail address]
      phone: ["phone|mobile|contact + number|no?", telephone, telephone number, cell phone, cell number]
      website: ["personal? + website|portfolio + url|link?"]
      current_company: [current company, current employer, company, organization, organisation]
      current_title: [current title, current role, current position, current job title]
      notice_period: [notice period, when can you start, earliest start date, availability to start]
      years_experience: ["total|overall? + years of + professional|relevant|total? + experience"]
      timezone: [time zone, timezone]
      location: [location, current location, "where are you + based|located"]
    sensitive:
      - salary
      - "compensation*"
      - "pay + expectation*"
      - expected pay
      - "desired + pay|rate|salary"
      - rate expectation
      - visa
      - "sponsor*"
      - authorized to work
      - authorised to work
      - legally authorized
      - legally authorised
      - work authorization
      - work authorisation
      - right to work
      - work permit
      - citizenship
      - nationality
      - gender
      - race
      - "ethnic*"
      - "veteran*"
      - "disabilit*"
      - "pronoun*"
      - sexual orientation
      - hispanic
      - latino
      - date of birth
      - dob
      - age
      - criminal
      - "conviction*"
      - background check
      - marital status
      - religion
      - height
      - weight
      - photo
      - photograph
      - salutation
      - equal employment opportunity
      - eeo
      - "self + identify|identification"
    sensitive_exact: [title, mr/ms, prefix]
    never_fill:
      - social security
      - ssn
      - national insurance
      - ni number
      - passport number
      - passport no
      - "driver's license number"
      - driving licence number
      - "bank + account|details"
      - account number
      - routing number
      - sort code
      - iban
      - swift code
      - bic
      - tax id
      - tax identification
      - taxpayer
      - national id number
      - government id
      - social insurance number
      - medicare number
      - credit card
      - card number
    never_fill_exact: [tin, itin, ein, sin, nino, id number]
    groups:
      employment:
        org: [employer, company, company name, employer name, organisation, organization, name of employer]
        title: [job title, title, position, role, position held, job role]
        where: [location, city]
        start: [start date, from, date started, start]
        end: [end date, to, date left, end]
      education:
        school: [school, institution, university, college, school name, establishment]
        degree: [degree, qualification, award]
        discipline: [subject, field of study, major, course]
        start_year: [start year, from]
        end_year: [end year, graduation year, to, year completed, date awarded]
      reference:
        name: [name, full name, referee name, reference name, "name of + referee|reference"]
        role: [job title, title, position, role]
        org: [organisation, organization, company, employer]
        email: [email, e-mail, email address]
        phone: [phone, telephone, phone number, telephone number, mobile]
        relationship: [relationship, relationship to you, how do you know them, capacity known, "in what capacity + do you know them|known?"]
    group_words:
      employment: ["employment|job|work + history|experience?", employer, "previous|current + employment|job|employer"]
      education: [education, qualification, school, university]
      reference: ["referee*", "reference*"]
    add: ["add + another|more|a?", "add + employment|job|position|education|qualification|reference|referee"]
    letter: [cover letter, covering letter, supporting statement, personal statement, motivation letter]
  en-IN:
    profile:
      email: [email id, e-mail id, mail id]
      notice_period: [notice period (in days), notice period in days]
      years_experience: [total experience, total experience (in years), relevant experience]
      current_company: [current organisation, current organization]
      current_title: [current designation, designation]
    sensitive: ["current|expected + ctc", ctc, lpa, "father's name", "father name", "mother's name", "mother name", "husband's name", caste, reserved category, "category + general|obc|sc|st", obc, religion, marital status, date of birth, dob]
    never_fill: [aadhaar, aadhar, aadhaar number, pan number, pan card, permanent account number, uan, "pf + number|no", epf number, esic, voter id, ifsc]
    never_fill_exact: [pan, uid, pan no]
  en-PH:
    sensitive: [civil status, religion, height, weight, date of birth, expected salary, asking salary]
    never_fill: [sss number, sss no, tin number, tin no, philhealth, pag-ibig, hdmf, umid, postal id]
    never_fill_exact: [sss, tin]
  de:
    profile:
      first_name: [vorname]
      last_name: [nachname, familienname]
      full_name: [vollstandiger name, vor- und nachname]
      email: [e-mail, e-mail-adresse, email-adresse, e mail adresse]
      phone: [telefon, telefonnummer, handy, handynummer, mobilnummer, mobil]
      city: [ort, wohnort, stadt]
      country: [land, wohnland]
      notice_period: [kundigungsfrist, "fruhest + moglicher? + eintrittstermin", eintrittsdatum, verfugbar ab]
      current_title: [aktuelle position, aktuelle berufsbezeichnung]
      current_company: [aktueller arbeitgeber]
