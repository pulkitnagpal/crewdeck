# Availability grids ("Monday: Morning | Evening | Not available"), answered from jobs/search.md → work_pattern: the
# words for each day, for weekend days, and for what each option means (a shift, any time, or not available).
availability:
  question: ["availab*", "verfugbar*", "disponib*", "beschikbaar*", shifts you can work, which shifts]
  weekdays: [monday, tuesday, wednesday, thursday, friday, weekdays, montag, dienstag, mittwoch, donnerstag, freitag, lunes, martes, miercoles, jueves, viernes, lundi, mardi, mercredi, jeudi, vendredi, segunda, terca, quarta, quinta, sexta, lunedi, martedi, mercoledi, giovedi, venerdi, maandag, dinsdag, woensdag, donderdag, vrijdag]
  weekend: [saturday, sunday, weekend, weekends, samstag, sonntag, wochenende, sabado, domingo, samedi, dimanche, sabato, zaterdag, zondag]
  options:
    day: [day, days, morning, mornings, afternoon, afternoons, daytime, day shift, first shift, fruh, fruhschicht, tag, tagschicht, manana, matin, journee, manha, mattina, ochtend, dag]
    evening: [evening, evenings, late, swing, second shift, abend, spatschicht, tarde, soir, soiree, noite, sera, avond]
    night: [night, nights, overnight, third shift, graveyard, nacht, nachtschicht, noche, nuit, notte]
    any: [any, anytime, any time, all, all day, open, flexible, open availability, ganztags, cualquiera, toute la journee]
    none: [not available, unavailable, none, no, nicht verfugbar, no disponible, indisponible, nao disponivel, non disponibile, niet beschikbaar]

