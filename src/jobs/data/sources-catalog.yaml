# Crewdeck Jobs — job-source catalog (design §24.2, D18). Read by src/jobs/catalog.ts; test/jobs/catalog.test.ts keeps
# it in step with providers.manifest.json (one entry per allow-listed or excluded provider).
#
# What it is: a read-only description of every job-source "provider" Crewdeck ships, so the setup interview can
# propose sources from a user's profile (country, field, workplace) and the UI can filter them. It is shipped in the
# repo and never edited per user: the user's own selection lives in their vault note `jobs/sources.md`.
#
# Where the providers come from: career-ops (https://github.com/career-ops-hq/career-ops, MIT), pinned at commit
# f3b043d3dd212f04d2dabdb0d8e5c4b288a5c50d (see providers.manifest.json). Every entry was checked against the
# provider's own code at that commit (P9a, 2026-11-20): header comment, option parsing, host allow-lists, country and
# locale codes, page constants and detect().
#
# Entry fields (one entry per provider id, sorted by id):
#   id          career-ops provider id (= file name minus .mjs)
#   name        human name of the board / ATS / employer
#   kind        one of `kinds` below
#   needs       one of `needs` below: what an entry must carry before the provider returns anything useful
#   config      option keys the provider reads that matter for targeting (dotted = nested block, e.g. amazon.loc_query)
#   fill        (needs: config and keyword-driven boards) how Crewdeck fills those keys from the user's notes at fetch
#               time; never written to the note, and a key the user set by hand keeps their value:
#                 <key>: { from: titles | first_title | onsite_place | country | country_name,
#                          max: N (titles), map: { <country id>: value }, format: "…{CC}…{cc}…", required: true }
#               A `required` fill that can't be made (no titles, no country in `map`) skips the source with the reason.
#   detect      true only when the provider's detect() claims an entry that has just a careers_url (no provider:), so a
#               pasted careers page auto-routes to it. Narrower than manifest.detectors, which lists every file with a
#               detect function (some only match `provider: <id>` or explicit config).
#   regions     where the jobs are: region ids and lowercase ISO 3166-1 alpha-2 countries from places.yaml
#   families    role families from `families` below; ATSes are [any] (or their sector) plus a `note` on typical employers
#   workplace   which of onsite / hybrid / remote it mostly carries
#   languages   posting languages (ISO 639-1)
#   seniority   any | entry | experienced
#   runnable    false for manifest.excluded providers (cannot run in Crewdeck's sandbox); `why` says why
#   retired     true when the upstream provider is kept only so old configs fail loudly: its fetch() always throws
#   blocked     true when the site currently refuses automated reads (e.g. a Cloudflare challenge on every request):
#               never suggested; it may still be added by hand
#   coverage    one factual line on limits (caps, truncation, required keys, blocking)
#   note        (ATS only) what kinds of employers typically use it: market knowledge, never measured
#   confidence  grades the fields Crewdeck acts on (kind, needs, config, detect, regions, families, workplace, languages):
#               high = the code or its header confirms them; medium = one of them (usually regions or families) is
#               market knowledge the code doesn't confirm, named in `unsure`; low = kind or regions is a guess
#   unsure      what the code could not confirm
#
# Region/family claims for ATSes and remote boards are about the vendor's typical customers or the board's typical
# mix, not measured from live data (nothing here was fetched); `unsure` says so wherever it matters.

families:
  engineering-it: "Software, IT, infrastructure, security."
  data: "Data, analytics, ML/AI."
  product-project: "Product management and project/programme management."
  design: "UX/UI, graphic and product design."
  creative-media: "Writing, content, translation, media, arts."
  marketing: "Marketing, growth, communications."
  sales: "Sales, business development, account management."
  customer-service: "Customer support and service."
  finance-accounting: "Finance, accounting, audit, banking roles."
  legal: "Legal and compliance."
  people-hr: "HR, recruiting, people operations."
  office-admin: "Administration, reception, office and executive support."
  operations: "General operations and supply-chain management."
  healthcare: "Clinical roles: nursing, medicine, allied health, pharmacy."
  care-social: "Social work, care work, childcare."
  education: "Schools, higher education, training."
  science-research: "Laboratory, academic and industrial research."
  engineering-physical: "Mechanical, civil, electrical and manufacturing engineering."
  trades-construction: "Skilled trades and construction."
  manufacturing-production: "Factory and production work."
  logistics-transport: "Warehouse, driving, delivery, rail and transport."
  retail: "Store and retail roles."
  hospitality-food: "Hotels, restaurants, catering, food service."
  public-sector: "Government and public employers, any field."
  any: "A general board or ATS that carries every field."

kinds:
  board: "A job board, read board-wide (many employers in one entry)."
  aggregator: "Re-lists other boards' or companies' postings (VC portfolio boards, cross-tenant feeds)."
  ats: "An applicant-tracking system: one entry = one employer's careers page; needs that employer's careers_url."
  national: "A government / public employment service."
  field: "A board for one field or sector (education, a tech niche, crypto, a programming language)."
  employer: "One specific company's own careers site."
  feed: "A generic reader (sitemap, WordPress feed, Telegram channel, Notion page, local parser)."

needs:
  none: "Runs from `provider: <id>` alone."
  careers_url: "Needs a URL: an employer's careers page (ATS, employer) or a search/board URL on the board's host."
  config: "Board-wide, but returns nothing (or the wrong slice) without keys such as keywords, queries or a filter block; `config` names them."

# Crewdeck's own LinkedIn source. Not a career-ops provider and not in providers.manifest.json.
linkedin:
  id: linkedin
  name: LinkedIn (Crewdeck)
  kind: board
  needs: none
  config: []
  detect: false
  regions: [world]
  families: [any]
  workplace: [onsite, hybrid, remote]
  languages: [en]
  seniority: [any]
  runnable: true
  switch: [linkedin_search, linkedin_links, easy_apply]
  default_on: false
  coverage: "Crewdeck's own source. A user-only risky switch, off by default: only the user can turn it on, never setup or Claude on its own."
  confidence: high
  unsure: "Posting languages follow the user's market; [en] is a placeholder."

