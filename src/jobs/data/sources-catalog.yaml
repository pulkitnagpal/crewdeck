    languages: [en]
    seniority: [any]
    runnable: true
    coverage: "Only 4-day-week / reduced-hours employers; default 3 pages x 25 = about 75 newest postings (cap 50 pages)."
    confidence: medium
    unsure: "Field and country mix not measured; the code names no countries or fields (looks startup/tech-heavy, US/UK-heavy)."

