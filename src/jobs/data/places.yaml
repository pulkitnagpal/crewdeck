# Gazetteer for Crewdeck Jobs: places, their other names and what contains them (city ⊂ state ⊂ country ⊂ regions).
# Used to compile location rules from jobs/search.md, so "EU only" passes for someone in Berlin.
#
# Matching: names and aliases ignore case and accents; `codes` match only as written (capitals), so "US" is the
# country but "us" is a pronoun; US state and Canadian province `abbr` match only after a comma ("Austin, TX").
# `in` lists direct parents; containment is transitive. Cities carry approximate coordinates [lat, lon] for the
# commute-distance check (places.commute_km).

regions:
  - { id: world, name: Worldwide, aliases: [world, world-wide, anywhere, anywhere in the world, global, globally, worldwide remote] }
  - { id: emea, name: EMEA, aliases: [Europe Middle East and Africa], codes: [EMEA], in: [world] }
  - { id: europe, name: Europe, in: [emea] }
  - { id: eea, name: European Economic Area, codes: [EEA], in: [europe] }
  - { id: european-union, name: European Union, codes: [EU, E.U.], in: [eea] }
  - { id: dach, name: DACH region, aliases: [D-A-CH], codes: [DACH], in: [europe] }
  - { id: nordics, name: Nordics, aliases: [Nordic countries, Nordic region, Scandinavia], in: [europe] }
  - { id: benelux, name: Benelux, in: [europe] }
  - { id: middle-east, name: Middle East, in: [emea] }
  - { id: gcc, name: Gulf Cooperation Council, aliases: [Gulf states, GCC countries], codes: [GCC], in: [middle-east] }
  - { id: mena, name: MENA, aliases: [Middle East and North Africa], codes: [MENA], in: [emea] }
  - { id: africa, name: Africa, in: [emea] }
  - { id: apac, name: APAC, aliases: [Asia-Pacific, Asia Pacific, Asia/Pacific], codes: [APAC, APJ], in: [world] }
  - { id: asia, name: Asia, in: [apac] }
  - { id: south-asia, name: South Asia, in: [asia] }
  - { id: southeast-asia, name: Southeast Asia, aliases: [South East Asia, South-East Asia], in: [asia] }
