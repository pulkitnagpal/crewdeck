# Title words (design §24.5, D26): what Crewdeck's title matcher knows about job titles in each language. Data, not
# code: add a language or a word here and the gate, rank, LinkedIn terms and the preview all read it. The matcher uses
# every language at once (postings come in any language on any board); only compound tails depend on the language.
#
# Per language:
#   seniority: word or two-word phrase → [canonical form, class]. Classes: entry, student (internships, working
#              students, apprenticeships), mid, senior, none (set apart, no level). Set apart from the role words: they
#              feed seniority_prefer, exclude_title_words and roles.level, never block a match.
#   end_role:  seniority words that stay role words at the end of a title ("Tech Lead", "Team Lead").
#   stopwords: dropped before matching. prepositions (a subset) end the head of a title ("Teacher of Maths" → teacher).
#   endings:   what a target word may add and still match (plurals and gendered forms only: "nurse" → "nurses",
#              never "nursery"). swaps: [target ending, posting ending] ("enfermero" → "enfermera").
#   compound:  true when the language writes compounds; a target word of 5+ letters then also matches a word's tail
#              ("buchhalter" → "Finanzbuchhalter").
#   abbreviations: whole-word-only words and what they stand for. They match only when the user lists them as a
#              variant; the preview proposes them when a target says the long form.
#   synonyms:  groups of words or phrases that mean the same inside a title of two or more words ("backend engineer" =
#              "backend developer" = "back end engineer"). A posting matched through them is a synonym match: it ranks a
#              little below the person's own words, never drops (ADR-0003).
#
# occupations (after the languages): families of titles for the same kind of work, in any language (ADR-0007's first
# step; ISCO/O*NET codes come later). Each family lists `same` groups (titles that are one job: a synonym match) and the
# families `adjacent` to it. A posting whose title is in the family of one of the person's targets is a family match;
# in an adjacent family, an adjacent match. These are scores (title fit 0..1), never drops: only a posting that fits no
# target at all falls under the "other occupations" floor (ranked last, not judged, counted apart).

gender:
  # Bracketed markers removed from titles (letters joined by / , | . are caught by rule: (m/w/d), (f/m/x), (h/f) …).
  brackets: [all genders, alle geschlechter, gn, gn*, any gender, tous genres, todos los generos, h/f/x, diverse]
  # Word endings joined to the word by one of these marks: Buchhalter*in, Lehrer:in, Mitarbeiter/-in, Traductor/a,
  # Comptable(e), Directeur/rice, Infirmier(ère), Enfermero/a, Vendedor(a).
  joiners: ["*", ":", "/", "_", "·", "/-", "("]
  endings: [in, innen, a, as, e, es, ne, nes, se, euse, rice, trice, ere, iere, o, os, x]

