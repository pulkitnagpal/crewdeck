# Signed-in job portals (ADR-0008 §6): what Crewdeck needs to scan each one in its own browser profile. Data only; code
# adapters live in src/jobs/portals/adapters/<id>.ts when data isn't enough (none yet). src/jobs/portals/catalog.ts
# validates this file on load.
#
# Fields:
#   id, name, countries (ISO alpha-2, or world), fields (job families from sources-catalog.yaml, or any)
#   hosts: the portal's own hosts (the guard proxy lets the profile reach these, their subdomains included)
#   cdn_hosts: other hosts its pages need (scripts, images, APIs); auth_hosts: extra hosts only the sign-in window needs
#   signup_url, login_url: where `crewdeck jobs portals connect <id> [--signup]` opens the window
#   signed_in: any one passing = signed in. cookie (a cookie name on the portal's hosts), url_pattern (an open page's
#     path matches), selector (present on an open page of the portal)
#   sign_in_wall: path patterns that mean "sign in first" (a scan stops there and marks the portal needs_sign_in)
#   search: url (template), url_place / url_remote (used instead when the query has a place / is remote), with
#     {q} {q_slug} {place} {place_slug} {remote} {recency} {page} {host}; empty query parameters are dropped.
#     remote / hybrid: the {remote} value for those queries; recency: { days: value } (the smallest ≥ 7 days is used);
#     page: { start, step, omit_first }; place_aliases: { slug: portal's slug }; country_hosts: { iso2: host }
#   job_url: pattern (a regex on the path), keep_params (query parameters that identify the posting), canonical
#     (optional template: {host}, {path}, {id} = the pattern's first group, and kept parameter names)
#   json: responses the page itself loads: url (regex), list (path to the items), where (path: regex), fields (paths)
#     or state: a value the page keeps on window (e.g. __NEXT_DATA__.props.pageProps; pane mode reads it, also from the
#     __NEXT_DATA__ script tag) with list relative to it. Pane mode re-fetches matching responses with the person's cookies.
#   limits: searches_per_run, pages_per_search, delay_ms (number, jittered ±40%, or [min, max]), min_hours, pages_per_day
#   headful: true when the portal refuses a headless browser
#   teach: true marks a lightweight entry (id, name, home_url, login_url?, countries, fields, kind, access, importance,
#     notes, risk; no search, job_url, cards or json): hosts come from home_url, and the person's reader
#     (<jobs.home>/portals/readers.yaml, src/jobs/portals/readers.ts) adds the rest when Claude teaches it
#   kind: portal, board, aggregator, niche, campus, staffing, freelance or government; access: signed-in or
#     public-search; importance: 1 (a top site for its field) to 3
#   risk: said once at connect, in plain words; verified: whether the search and job URLs were checked against the
#     portal's public pages (never signed in); notes: what was and wasn't checked
defaults:
  limits: { searches_per_run: 3, pages_per_search: 1, delay_ms: 10000, min_hours: 6, pages_per_day: 30 }
  auth_hosts: [accounts.google.com, www.google.com, www.gstatic.com, ssl.gstatic.com, apis.google.com, www.recaptcha.net, challenges.cloudflare.com, hcaptcha.com, js.hcaptcha.com, appleid.apple.com]
  sign_in_wall: ['^/(login|signin|sign-in|signup|register)\b', '/authwall', '/checkpoint/', '/uas/login']

portals:
  - id: linkedin
    name: LinkedIn
    kind: portal
    access: signed-in
    importance: 1
    countries: [world]
    fields: [any]
    hosts: [www.linkedin.com, linkedin.com]
    cdn_hosts: [static.licdn.com, media.licdn.com, static-exp1.licdn.com, platform.linkedin.com]
    signup_url: https://www.linkedin.com/signup
    login_url: https://www.linkedin.com/login
    signed_in: { cookie: li_at, url_pattern: '^/feed/' }
    sign_in_wall: ['^/(login|signup)\b', '/authwall', '/checkpoint/', '/uas/login']
    search:
      url: https://www.linkedin.com/jobs/search/?keywords={q}&location={place}&f_TPR={recency}&f_WT={remote}&start={page}
      remote: '2'
      hybrid: '3'
      recency: { 1: r86400, 7: r604800, 30: r2592000 }
      page: { start: 0, step: 25, omit_first: true }
    job_url: { pattern: '^/jobs/view/(?:[^/]*-)?(\d{6,})/?$', canonical: 'https://www.linkedin.com/jobs/view/{id}' }
    # No json adapter: re-requesting voyager needs LinkedIn's CSRF token and is the riskiest thing to send it. The signed-in
    # list (2026-11-21, /jobs/search-results/) carries each job's id on its card and its parts as paragraphs in order.
    cards:
      - item: 'div[role=button][componentkey^="job-card-component-ref-"]'
        id_attr: componentkey
        id_pattern: '^job-card-component-ref-(\d{6,})$'
        url_template: https://www.linkedin.com/jobs/view/{id}
        lines: { selector: p, title: 0, company: 1, location: 2 }
    limits: { searches_per_run: 3, pages_per_search: 1, delay_ms: [12000, 20000], min_hours: 12, pages_per_day: 25 }
    risk: LinkedIn's terms forbid automated access to signed-in pages and it restricts accounts it suspects. Crewdeck keeps to 3 searches every 12 hours and stops at the first check, but the account is yours and so is the risk.
    verified: true
    notes: Checked signed in, in Claude's browser pane on 2026-11-21 - /jobs/search/ redirects to /jobs/search-results/ keeping the filters (past week, remote, India); 25 cards a page, each with its id in componentkey.

  - id: naukri
    name: Naukri
    kind: portal
    access: signed-in
    importance: 1
    countries: [in]
    fields: [any]
    hosts: [www.naukri.com, naukri.com, login.naukri.com]
    cdn_hosts: [static.naukimg.com, img.naukimg.com, static.naukri.com]
    signup_url: https://www.naukri.com/registration/createAccount
    login_url: https://www.naukri.com/nlogin/login
    signed_in: { cookie: nauk_at, url_pattern: '^/mnjuser/' }
    sign_in_wall: ['^/nlogin/', '^/registration/']
    search:
      url: https://www.naukri.com/{q_slug}-jobs?k={q}&jobAge={recency}&wfhType={remote}
      url_place: https://www.naukri.com/{q_slug}-jobs-in-{place_slug}?k={q}&l={place}&jobAge={recency}&wfhType={remote}
      remote: '2'
      hybrid: '3'
      recency: { 1: '1', 3: '3', 7: '7', 15: '15', 30: '30' }
      place_aliases: { bengaluru: bangalore }
    job_url: { pattern: '^/job-listings-[a-z0-9-]+-\d{6,}$' }
    # No json adapter: the search API asks for a reCAPTCHA token on any repeat request (checked 2026-11-21), and Crewdeck
    # never gets past a challenge. The page's own cards carry everything a role needs.
    cards:
      # Signed out (and the classic layout): the card's own parts.
      - { item: '.srp-jobtuple-wrapper', title: 'a.title', company: '.comp-name', location: '.locWdth', posted_at: '.job-post-day' }
      # Signed in (Naukri TopTier, 2026-11-21): cards without links; each card's component holds the search API's job record.
      - item: '#jobs-list-header .cursor-pointer.rounded-3xl'
        react: jobData
        fields: { url: jdURL, title: title, company: companyName, location: 'placeholders[type=location].label', posted_at: createdDate }
    limits: { searches_per_run: 4, pages_per_search: 1, delay_ms: [8000, 15000], min_hours: 6, pages_per_day: 40 }
    risk: Naukri's terms don't allow automated use of the site. Crewdeck reads a few search pages, slowly, as you; your account carries the risk.
    verified: true
    notes: Checked in Claude's browser pane on 2026-11-21 (signed out) - the search URL with k, jobAge and wfhType, the job-listings pattern and the srp-jobtuple-wrapper cards. Signed in (same day) - the nauk_at cookie, /mnjuser/homepage, and the TopTier layout whose cards hold jobData.

