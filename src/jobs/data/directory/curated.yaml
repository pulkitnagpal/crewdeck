# Crewdeck Jobs — hand-curated company directory entries (design §8.2, ADR-0002). Read by src/jobs/directory/seed.ts.
#
# Two kinds of entry:
#   - an OVERLAY on a seed.csv row (same ats + board): adds regions/families/remote/size the dataset doesn't carry, or
#     quarantines a board found gone;
#   - an ADDITION for an employer the dataset lacks (other ATSes: Workday, Oracle, Keka, Darwinbox, Zoho Recruit).
#
# Fields:
#   ats, board   the board key. Workday boards are `<tenant>/<wdN>/<site>` (https://<tenant>.<wdN>.myworkdayjobs.com/<site>);
#                Keka is the subdomain of <sub>.keka.com/careers; Oracle and others give `url`.
#   name         company name
#   url          careers URL when it isn't derivable from ats + board
#   regions      where it mostly hires: place ids from places.yaml (countries or regions)
#   families     field families from sources-catalog.yaml it hires for
#   remote       true when the employer is known to hire remote (remote-first or a large remote share)
#   size         small | mid | large (market knowledge)
#   status       verified | quarantine. ONLY verified entries are used by default. Verified means the evidence URL was
#                checked on `checked` and showed what the entry claims (careers link / live board). Region, family and
#                size facts on a verified entry are market knowledge (confidence medium), not measured.
#   evidence     the URL that was checked (or, for an overlay, the seed row's public board URL)
#   checked      date of the check (YYYY-MM-DD)
#   note         why quarantined, or anything a reader should know
#
# Light checks made on 2026-11-20 (≤ 30 public requests): 4 public ATS board APIs, 7 official careers pages, 10
# Workday CXS probes (all refused with HTTP 429 bot protection, so nothing was verified that way and no retry was made),
# and a few web searches. Seed-row overlays not checked live rely on the dataset's July 2026 crawl.

