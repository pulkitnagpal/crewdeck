<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crewdeck</title>
<link rel="stylesheet" href="shell.css">
</head>
<body>
<div class="shell">
  <nav class="rail" aria-label="Crewdeck">
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M3 15l9-9 9 9"/><path d="M7 15v4h10v-4"/></svg>
    </div>
    <div class="group" id="nav"></div>
  </nav>
  <main class="stage">
    <header class="bar">
      <span class="crumb"><span class="crumb-kind" id="kind">Notes</span><span class="crumb-name" id="crumb">Memory</span></span>
      <span class="spacer"></span>
      <form class="ask" id="ask" autocomplete="off">
        <label class="sr" for="ask-text">Ask Claude</label>
        <input id="ask-text" placeholder="Ask Claude about this…" maxlength="2000">
        <button type="submit">Send</button>
      </form>
      <span class="sent" id="sent" role="status"></span>
      <a class="open" id="open" href="/notes/" target="_blank" rel="noopener">Open alone</a>
    </header>
    <div class="frames" id="frames"></div>
  </main>
</div>
<script src="shell.js"></script>
</body>
</html>
