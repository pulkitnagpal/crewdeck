<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crewdeck</title>
<link rel="stylesheet" href="shell.css">
</head>
<body>
<div class="shell">
  <nav class="rail" aria-label="Crewdeck">
    <div class="logo" aria-hidden="true">C</div>
    <button type="button" class="nav" data-view="notes" aria-label="Notes and memory" title="Notes and memory">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="7" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="13" cy="17" r="2.5"/><path d="M8 8l3 7M16 8l-2 7M8.5 7h7"/></svg>
    </button>
    <div class="projects" id="projects"></div>
  </nav>
  <main class="stage">
    <header class="bar">
      <span class="crumb" id="crumb">Notes</span>
      <span class="spacer"></span>
      <a class="open" id="open" href="/notes/" target="_blank" rel="noopener">Open alone ↗</a>
    </header>
    <div class="frames" id="frames"></div>
  </main>
</div>
<script src="shell.js"></script>
</body>
</html>
