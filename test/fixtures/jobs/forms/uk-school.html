<!doctype html>
<html lang="en-GB">
<head><meta charset="utf-8"><title>Apply: Teaching Assistant (Term Time Only) – Example Primary School, Leeds</title></head>
<body>
<!-- A fictional UK school application (P9h fixture): employment history with "Add another", referees, a supporting statement. -->
<form>
  <label for="title">Title</label><select id="title"><option value="">Select</option><option>Mr</option><option>Mrs</option><option>Ms</option><option>Miss</option><option>Dr</option></select>
  <label for="fn">First name *</label><input id="fn" required>
  <label for="sn">Surname *</label><input id="sn" required>
  <label for="em">Email address *</label><input id="em" type="email" required>
  <label for="tel">Telephone</label><input id="tel">
  <label for="ni">National Insurance number *</label><input id="ni" required>
  <fieldset><legend>Employment history</legend>
    <label for="e0">Employer</label><input id="e0">
    <label for="t0">Job title</label><input id="t0">
    <label for="s0">Start date</label><input id="s0" type="month">
    <label for="f0">End date</label><input id="f0" type="month">
    <label for="r0">Reason for leaving</label><textarea id="r0"></textarea>
    <button type="button">Add another employer</button>
  </fieldset>
  <fieldset><legend>References</legend>
    <label for="rn1">Reference 1 name</label><input id="rn1">
    <label for="rp1">Reference 1 position</label><input id="rp1">
    <label for="ro1">Reference 1 organisation</label><input id="ro1">
    <label for="re1">Reference 1 email</label><input id="re1" type="email">
    <label for="rt1">Reference 1 telephone</label><input id="rt1">
    <label for="rr1">Reference 1 relationship to you</label><input id="rr1">
    <label for="rn2">Reference 2 name</label><input id="rn2">
    <label for="re2">Reference 2 email</label><input id="re2" type="email">
  </fieldset>
  <label for="ss">Supporting statement</label><input id="ss" type="file">
  <button type="submit">Submit application</button>
</form>
</body>
</html>
