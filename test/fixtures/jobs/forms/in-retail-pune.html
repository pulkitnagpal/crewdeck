<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Apply: Store Manager – Example Retail Pvt Ltd, Pune</title></head>
<body>
<!-- A fictional Indian application form (P9h fixture): CTC, notice in days, family names, Aadhaar and PAN. -->
<form>
  <label for="name">Full Name *</label><input id="name" required>
  <label for="father">Father's Name *</label><input id="father" required>
  <label for="dob">Date of Birth *</label><input id="dob" type="date" required>
  <label for="mob">Mobile Number *</label><input id="mob" required>
  <label for="mail">Email ID *</label><input id="mail" required>
  <label for="loc">Current Location *</label><input id="loc" required>
  <label for="exp">Total Experience (in years) *</label><input id="exp" required>
  <label for="cctc">Current CTC (in LPA) *</label><input id="cctc" required>
  <label for="ectc">Expected CTC (in LPA) *</label><input id="ectc" required>
  <label for="np">Notice Period (in days) *</label><input id="np" required>
  <label for="aad">Aadhaar Number *</label><input id="aad" required>
  <label for="pan">PAN Number *</label><input id="pan" required>
  <label for="ms">Marital Status</label><select id="ms"><option value="">Select</option><option>Single</option><option>Married</option></select>
  <label for="cv">Upload Resume *</label><input id="cv" type="file" required>
  <button type="submit">Submit</button>
</form>
</body>
</html>
