# The title corpus (design §24.5, §24.12, P9c): nine fictional people from the audit (docs/jobs/impl/09-generic-audit.md),
# each with the targets and variants setup would propose, and posting titles from fictional companies with the
# expected outcome of the title rules (title gate, excluded words, level). `audit` is the audit's simulation row: every
# title there must pass with these targets. `v1` is what the person had in roles.titles before v0.4 (the old phrase
# gate): with those as roles.titles, the new matcher must pass everything the old gate passed (tested over the corpus).
# A `fail` entry may name the rule it must fail on ("title | rule").

E:
  who: Senior backend/AI engineer, India, remote
  search:
    roles:
      targets:
        - name: Backend engineer
          titles: [backend engineer, software engineer, platform engineer, site reliability engineer, SRE, full stack engineer, tech lead, backend developer, SDE, senior engineer, staff engineer]
          families: [engineering-it]
          skills: [Python, Go, Kubernetes]
        - name: AI engineer
          titles: [ai engineer, ml engineer, machine learning engineer, llm engineer]
          families: [engineering-it, data]
          skills: [LLM, PyTorch]
      seniority_prefer: [senior, staff, lead]
      exclude_title_words: [intern, sales]
      level: experienced
    languages: [{ name: English, level: fluent }, { name: Hindi, level: native }]
  v1: [backend engineer, ai engineer]
  audit:
    passes: [Senior Backend Engineer]
    dropped: ["Software Engineer, Backend", Full Stack Engineer, Tech Lead, Senior Engineer, SRE, Staff Engineer - AI Platform, Backend Developer, ML Engineer, "Engineer II, Backend Services"]
